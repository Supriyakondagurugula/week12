apiVersion: apps/v1
kind: Deployment
metadata:
  name: seleniumtestdemoapp1-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seleniumtestdemoapp1
  template:
    metadata:
      labels:
        app: seleniumtestdemoapp
    spec:
      containers:
        - name: seleniumtestdemoapp
          image: supriyamallesh/sample:seleniumtestimage
          ports:
            - containerPort: 5000